<!DOCTYPE html>
<html>
<head>
    <title>Remote Controller - RemRam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #controls {
            position: fixed;
            top: calc(10px + env(safe-area-inset-top));
            left: calc(10px + env(safe-area-inset-left));
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        button.ui-btn {
            background: rgba(40, 40, 40, 0.9);
            color: white;
            border: 1px solid #444;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }

        #native-invoker {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        #click-zones {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            pointer-events: none;
            z-index: 1;
        }

        .zone {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #output {
            position: fixed;
            bottom: calc(10px + env(safe-area-inset-bottom));
            left: calc(10px + env(safe-area-inset-left));
            color: #555;
            font-size: 12px;
            pointer-events: none;
        }

        #settings-container {
            position: fixed;
            bottom: calc(10px + env(safe-area-inset-bottom));
            right: calc(10px + env(safe-area-inset-right));
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        #settings-menu {
            display: none;
            background: rgba(40, 40, 40, 0.95);
            border: 1px solid #444;
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            width: 150px;
        }

        #settings-menu label {
            color: #ccc;
            font-size: 12px;
            display: block;
            margin-bottom: 8px;
        }

        #sens-slider {
            width: 100%;
            accent-color: #666;
            cursor: pointer;
        }

        #settings-icon {
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid #444;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>

    <input type="text" id="native-invoker" autocomplete="off" autocapitalize="off" spellcheck="false">

    <div id="controls">
        <button class="ui-btn" onclick="focusNative()">Keyboard</button>
    </div>

    <div id="settings-container">
        <div id="settings-menu">
            <label>Sensitivity: <span id="sens-val">2</span></label>
            <input type="range" id="sens-slider" min="1" max="10" step="0.5" value="2">
        </div>
        <div id="settings-icon" onclick="toggleSettings()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
    </div>

    <div id="output"></div>

    <div id="click-zones">
        <div class="zone">LEFT</div>
        <div class="zone">RIGHT</div>
    </div>

    <script>
        let start = false;

        const socketUrl = `ws://${window.location.hostname}:${window.location.port}/ws`;
        let socket;

        let resX = 0, resY = 0
        function connect() {
            socket = new WebSocket(socketUrl);

            socket.onopen = () => write("CONNECTED");
            socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type == "res") { resX = data.x; resY = data.y; }
            };
        }
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible') {
                connect();
            }
        })

        connect();

        const nativeInput = document.getElementById('native-invoker');

        function focusNative() {
            nativeInput.focus();
        }

        nativeInput.oninput = (e) => {
            if (e.data) sendKey(e.data);
            nativeInput.value = "";
        };

        nativeInput.onkeydown = (e) => {
            if (e.key === "Backspace") sendKey('\b');
            if (e.key === "Enter") sendKey('\n');
            if (e.key === "Shift") sendKey('\x10')
        };

        function sendKey(char) {
            char = char.toLowerCase();
            socket.send(JSON.stringify({ type: 3, key: char.charCodeAt(0) }));
        }

        const isFirstMove = new Map();
        const activePointers = new Map();
        let sensitivity = 2.0;

        let currentX = 0, currentY = 0, startTime, endTime;
        let leftCount = 0, leftCountTimer = null, leftPress = false;

        document.addEventListener("pointerdown", (e) => {
            if (e.target.closest('#controls') || e.target.closest('#settings-container')) return;
            start = true;

            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            isFirstMove.set(e.pointerId, true); 

            startTime = Date.now();
            if ((startTime - endTime) < 100 && leftCount > 0) {
               mousePress();
            }

            e.target.setPointerCapture(e.pointerId);

        });

        document.addEventListener("pointermove", (e) => {
            if (!start) return;

            const prevPos = activePointers.get(e.pointerId);
            if (!prevPos) return;

            const deltaX = e.clientX - prevPos.x;
            const deltaY = e.clientY - prevPos.y;
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (isFirstMove.get(e.pointerId)) { // this avoids touch slop bug
                isFirstMove.set(e.pointerId, false);
                return;
            }

            if (activePointers.size >= 2) {
                mouseScroll(deltaX, deltaY);
            } else {
                mouseMove(deltaX, deltaY);
           }
        });

        document.addEventListener("pointerup", (e) => {
            start = false;

            activePointers.delete(e.pointerId);
            isFirstMove.delete(e.pointerId);

            endTime = Date.now();
            if (leftPress) {
               mouseRelease();
               return;
            }
            if ((endTime - startTime) < 100) {
              if (e.target.closest('#settings-container')) return;
 
              leftCount++;

              if (leftCountTimer) clearTimeout(leftCountTimer);
              leftCountTimer = setTimeout(() => { leftCount = 0; leftCountTimer = null; }, 250);

              mouseClick(e.clientX);
            }
        });

        document.addEventListener("pointercancel", (e) => {
            start = false;
            activePointers.delete(e.pointerId);
        });

        document.addEventListener("lostpointercapture", (e) => {
            start = false;
            activePointers.delete(e.pointerId);
        });

        function mouseScroll(deltaX, deltaY) {
            if (Math.abs(deltaY) > Math.abs(deltaX)) {
                if (Math.abs(deltaY) > 2) socket.send(JSON.stringify({ type: 6, horizontal: false, delta: deltaY > 0 ? 1 : -1 }));
            } else {
                if (Math.abs(deltaX) > 2) socket.send(JSON.stringify({ type: 6, horizontal: true, delta: deltaX > 0 ? -1 : 1 }));
            }
        }

        function mouseMove(deltaX, deltaY) {
            currentX = Math.round(Math.max(0, Math.min(resX, currentX + (deltaX * sensitivity))));
            currentY = Math.round(Math.max(0, Math.min(resY, currentY + (deltaY * sensitivity))));
            socket.send(JSON.stringify({ type: 0, x: currentX, y: currentY }));
        }

        function mousePress() {
            leftPress = true;
            socket.send(JSON.stringify({ type: 4 }));
        }

        function mouseRelease() {
            leftPress = false;
            socket.send(JSON.stringify({ type: 5 }));
        }

        function mouseClick(tapX) {
            if (tapX < window.innerWidth / 2) {
                socket.send(JSON.stringify({ type: 1 }));
            } else {
                socket.send(JSON.stringify({ type: 2 }));
            }
        }

        function write(m) {
            document.getElementById("output").textContent = m;
        }

        window.oncontextmenu = (e) => { e.preventDefault(); return false; };

        const menu = document.getElementById('settings-menu');
        const slider = document.getElementById('sens-slider');
        const valDisplay = document.getElementById('sens-val');

        function toggleSettings() {
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }

        slider.oninput = function() {
            sensitivity = parseFloat(this.value);
            valDisplay.textContent = this.value;
        };
    </script>
</body>
</html>
