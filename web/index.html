<!DOCTYPE html>
<html>
  <head>
    <title>Go WebSocket Client</title>
  </head>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        overflow: hidden;
    }
  </style>
  <body>

    <h1>WebSocket Output</h1>
    <button id="toggleBtn" onclick="toggle()">start</button>
    <div id="output"></div>

    <script>
      let start = false
      const output = document.getElementById("output");
      const socket = new WebSocket("ws://192.168.0.110:8080/ws");

      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;

      let resX = 0;
      let resY = 0;

      let startTime;

      socket.onopen = () => write("CONNECTED");
      socket.onmessage = (e) => {
        const data = JSON.parse(e.data)
        if (data.type == "res") {
            assignRes(data.x, data.y)
        }
      }; 
      socket.onclose = () => write("DISCONNECTED");
      socket.onerror = (e) => write("ERROR");

      document.addEventListener("pointerdown", (e) => {
          startTime = Date.now();

          startX = Math.round(e.clientX);
          startY = Math.round(e.clientY);
          e.target.setPointerCapture(e.pointerId);
      });

      document.addEventListener("pointermove", (e) => {
          if (!start) return;

          const deltaX = startX - Math.round(e.clientX);
          const deltaY = startY - Math.round(e.clientY);

          let x = currentX - deltaX;
          let y = currentY - deltaY;
          if (x < 0) {
            x = 0
          }
          if (y < 0) {
            y = 0
          }

          if (x > resX) {
            x = resX
          }
          if (y > resY) {
            y = resY
          }

          const data = {
              type: 0,
              x: x,
              y: y 
          };

          socket.send(JSON.stringify(data));
      });

      document.addEventListener("pointerup", (e) => {
          const duration = Date.now() - startTime;
          
          if (duration < 100) {
            const data = {
                type: 1,
            };

            socket.send(JSON.stringify(data))
            return
          }

          if (currentX - (startX - Math.round(e.clientX)) <= resX) {
            currentX -= (startX - Math.round(e.clientX));
          } else {
            currentX = resX
          }
          if (currentY - (startY - Math.round(e.clientY)) <= resY) {
            currentY -= (startY - Math.round(e.clientY));
          } else {
            currentY = resY
          }
      })

      function write(message) {
           const div = document.createElement("div");
           div.textContent = message;
           output.appendChild(div);
      }

      function assignRes(x, y) {
        console.log(x, y);
        resX = x;
        resY = y;
      };

      function toggle() {
        start = !start;

        document.getElementById("toggleBtn").innerText = start ? "sending" : "start";
      }

    </script>

  </body>
</html>
